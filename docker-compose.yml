name: docker-nginx-sql

services:
  mariadb:
    image: mariadb:11
    container_name: dns-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - ./data/db-data:/var/lib/mysql
      - ./db/mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dns-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: dns-backend:dev
    container_name: dns-backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      ConnectionStrings__MariaDB: ${MARIADB_CONNECTION}
    volumes:
      - ./data/backend:/app/data
    networks:
      - dns-net

  frontend:
    image: dns-frontend:dev
    container_name: dns-frontend
    restart: unless-stopped
    networks:
      - dns-net

  nginx:
    image: nginx:1.27-alpine
    container_name: dns-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - dns-net

networks:
  dns-net:
    driver: bridge
